name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe DEPLOY para confirmar el despliegue a producción"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # ==========================================================
  # FRONTEND: LINT Y COMPILACIÓN
  # ==========================================================
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Verificar VITE_API_URL
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::El secreto VITE_API_URL no está configurado"
            exit 1
          fi

          echo "VITE_API_URL está configurada correctamente"

      - name: Ejecutar lint del frontend
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  # ==========================================================
  # BACKEND: PRISMA, LINT Y COMPILACIÓN
  # ==========================================================
  backend:
    name: Backend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Verificar DATABASE_URL
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::El secreto DATABASE_URL no está configurado"
            exit 1
          fi

          echo "DATABASE_URL está configurada correctamente"

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Ejecutar lint del backend
        run: npm run lint --if-present

      - name: Compilar backend
        run: npm run build

  # ==========================================================
  # PRISMA: MIGRACIONES CONTRA POSTGRESQL EFÍMERO
  # ==========================================================
  migraciones:
    name: Migraciones y Seeds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/testdb?schema=public

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Validar configuración de Prisma
        run: npx prisma validate

      - name: Aplicar migraciones de Prisma
        run: npx prisma migrate deploy

      - name: Verificar estado de las migraciones
        run: npx prisma migrate status

  # ==========================================================
  # FRONTEND: PRUEBAS UNITARIAS Y COBERTURA
  # ==========================================================
  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Verificar variables seguras
        shell: bash
        run: |
          error=0

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::El secreto DATABASE_URL no está configurado"
            error=1
          fi

          if [ -z "$VITE_API_URL" ]; then
            echo "::error::El secreto VITE_API_URL no está configurado"
            error=1
          fi

          if [ "$error" -ne 0 ]; then
            exit 1
          fi

          echo "Las variables seguras están configuradas correctamente"

      - name: Ejecutar pruebas y cobertura
        run: npx vitest run --coverage

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-frontend
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # ==========================================================
  # PRUEBAS END-TO-END CON PLAYWRIGHT
  # ==========================================================
  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d task_manager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Esta URL corresponde exclusivamente al PostgreSQL temporal
      # creado para las pruebas E2E.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/task_manager?schema=public

      # Se obtiene desde GitHub Secrets.
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Verificar VITE_API_URL
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::El secreto VITE_API_URL no está configurado"
            exit 1
          fi

          echo "VITE_API_URL está configurada correctamente"

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: ./backend
        run: npx prisma generate

      - name: Crear estructura de base de datos
        working-directory: ./backend
        run: npx prisma db push

      - name: Compilar backend
        working-directory: ./backend
        run: npm run build

      - name: Iniciar backend
        working-directory: ./backend
        run: |
          nohup npm run start > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Esperar disponibilidad del backend
        shell: bash
        run: |
          for intento in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              echo "Backend disponible"
              exit 0
            fi

            echo "Esperando backend: intento $intento de 30"
            sleep 2
          done

          echo "::error::El backend no pudo iniciar"
          cat backend/backend.log || true
          exit 1

      - name: Instalar Chromium y dependencias
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npx playwright test

      - name: Mostrar log del backend si falla
        if: failure()
        run: cat backend/backend.log || true

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Guardar evidencias de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-playwright
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Guardar log del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-backend-e2e
          path: backend/backend.log
          if-no-files-found: warn
          retention-days: 7

  # ==========================================================
  # DESPLIEGUE AUTOMÁTICO DEL BACKEND A STAGING
  # ==========================================================
  deploy-staging:
    name: Deploy a Staging

    needs:
      - frontend
      - backend
      - pruebas
      - e2e
      - migraciones

    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Verificar Railway CLI
        run: railway --version

      - name: Desplegar backend a Railway staging
        run: railway up --service Task-Manager-React --environment staging --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ==========================================================
  # DESPLIEGUE MANUAL DEL BACKEND A PRODUCCIÓN
  # ==========================================================
  deploy-produccion:
    name: Deploy a Producción (manual)

    needs:
      - frontend
      - backend
      - pruebas
      - e2e
      - migraciones

    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirmacion == 'DEPLOY' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: production

    concurrency:
      group: railway-production
      cancel-in-progress: false

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Verificar Railway CLI
        run: railway --version

      - name: Desplegar backend a Railway producción
        run: railway up --service backend --environment production --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
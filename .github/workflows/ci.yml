name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # FRONTEND: LINT Y COMPILACIÓN
  # ==========================================================
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Ejecutar lint del frontend
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  # ==========================================================
  # BACKEND: PRISMA, LINT Y COMPILACIÓN
  # ==========================================================
  backend:
    name: Backend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Ejecutar lint del backend
        run: npm run lint --if-present

      - name: Compilar backend
        run: npm run build --if-present

  # ==========================================================
  # FRONTEND: PRUEBAS UNITARIAS Y COBERTURA
  # ==========================================================
  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npx vitest run --coverage

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-frontend
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # ==========================================================
  # PRUEBAS END-TO-END CON PLAYWRIGHT
  # ==========================================================
  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Instalar Chromium y dependencias
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npx playwright test

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Guardar evidencias de pruebas E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-playwright
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
services:
  postgres:
    image: postgres:16-alpine
    container_name: task-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U appuser -d appdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    container_name: task-manager-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://appuser:apppass@postgres:5432/appdb
      PORT: 4000
      SECRET_KEY: clave_local_docker

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    container_name: task-manager-frontend

    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  postgres_data: